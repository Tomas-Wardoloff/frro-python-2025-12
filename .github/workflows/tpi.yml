name: TPI

on:
  push:
    branches: "TPI"
  pull_request:
    branches: "TPI"
  workflow_dispatch:

jobs:

  tpi-test:
    name: Tests TPI (Python ${{ matrix.python-version }})

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 3.11 es el minimo soportado; 3.13 es el que se usa en desarrollo
        python-version: ['3.11', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: TPI/requirements-dev.txt

      - name: Install Dependencies
        working-directory: TPI
        # requirements-dev incluye produccion mas qiskit y las herramientas de
        # test, para que la validacion cruzada entre motores corra en CI
        run: pip install -r requirements-dev.txt

      # Se corren por tipo para que el reporte diga que se rompio, no solo
      # que algo fallo.
      - name: Tests unitarios y de reglas de negocio
        working-directory: TPI
        run: |
          pytest tests/test_business_rules.py tests/test_config.py \
                 tests/test_models.py tests/test_bb84.py -v

      - name: Tests de integracion y de la capa web
        working-directory: TPI
        run: pytest tests/test_integration.py tests/test_web.py tests/test_trace.py tests/test_fase4.py tests/test_app.py -v

      - name: Validacion cruzada de los motores de simulacion
        working-directory: TPI
        run: pytest tests/test_engines.py -v

      - name: Tests de aceptacion (recorridos de usuario)
        working-directory: TPI
        run: pytest tests/test_acceptance.py -v

      # Red de seguridad: la suite completa, por si algun archivo quedo fuera
      # de los grupos de arriba.
      - name: Suite completa
        working-directory: TPI
        run: pytest tests/ -q

      # La deteccion de espias es probabilistica y varias corridas usan azar.
      # Repetir la suite detecta tests inestables antes de que molesten.
      - name: Estabilidad (la suite tres veces)
        working-directory: TPI
        run: |
          for i in 1 2 3; do
            echo "--- corrida $i ---"
            pytest tests/ -q || exit 1
          done

  deploy-check:
    name: La app arranca sin Qiskit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: TPI/requirements.txt

      # Qiskit pesa ~130 MB con SciPy y no entra en los limites de varias
      # plataformas. Este job instala SOLO las dependencias de produccion y
      # verifica que la app levante y simule igual con el motor analitico.
      - name: Install production dependencies only
        working-directory: TPI
        run: pip install -r requirements.txt

      - name: App boots and simulates without Qiskit
        working-directory: TPI
        env:
          FLASK_ENV: testing
        run: |
          python - <<'PY'
          from business.bb84 import motores_disponibles, simulate_bb84
          assert motores_disponibles() == ['analytic'], motores_disponibles()

          r = simulate_bb84(400, has_eve=True, seed=1)
          assert r.success and r.engine == 'analytic'

          # Pedir qiskit sin tenerlo tiene que degradar, no romper
          assert simulate_bb84(100, engine='qiskit', seed=1).engine == 'analytic'

          from app import create_app
          from config import TestingConfig
          assert create_app(TestingConfig).test_client().get('/').status_code == 200
          print('La app funciona sin Qiskit')
          PY

  browser-test:
    name: Tests de navegador (Playwright)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: TPI/requirements-dev.txt

      - name: Install Dependencies
        working-directory: TPI
        run: pip install -r requirements-dev.txt

      - name: Install Chromium
        working-directory: TPI
        run: playwright install --with-deps chromium

      # Es lo unico que verifica el JavaScript: el resto de la suite llega
      # hasta el HTML que sale del servidor. El test central compara los bits
      # dibujados en pantalla contra los que devolvio la API, porque la
      # animacion llego a generarlos con Math.random() en el browser.
      - name: Tests de navegador
        working-directory: TPI
        run: pytest tests/ -m browser -v

  style-test:
    needs: tpi-test
    name: Verificación de Estilo (Flake8)

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Flake8
        run: pip install flake8

      # F821 (nombre no definido) ya NO se silencia: escondia bugs reales,
      # como la referencia a User.created_at que no existia en el modelo.
      # C901 tampoco, para que --max-complexity sirva de algo.
      #
      # Se usa --extend-ignore y no --ignore: este ultimo reemplaza la lista
      # por defecto de flake8, que incluye W503 porque PEP8 recomienda cortar
      # la linea ANTES del operador binario, no despues.
      - name: Test Style
        run: |
          flake8 TPI \
            --exclude=TPI/.venv,TPI/__pycache__ \
            --count --max-complexity=15 --max-line-length=130 \
            --extend-ignore=E266,F401,E402,W293,E303 \
            --statistics --show-source
