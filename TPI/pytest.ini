[pytest]
# Configuración de pytest para el TPI
testpaths = tests
# Permite importar app, business, datos y views sin tocar sys.path en cada test
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    browser: tests que manejan un navegador real con Playwright (lentos)

# Los tests de navegador quedan fuera de la corrida por defecto: tardan varios
# minutos porque esperan a que la animación termine de verdad.
#   pytest tests/              -> todo menos navegador (rápido)
#   pytest tests/ -m browser   -> sólo los de navegador
#   pytest tests/ -m ""        -> absolutamente todo
addopts = -v --tb=short -m "not browser"
